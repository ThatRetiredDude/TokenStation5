<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>TokenStation5 terminal</title>
<link rel="stylesheet" href="/ts5/web/xterm.css">
<style>
  :root { --bg: #0d1117; --panel: #161b22; --line: #30363d; --fg: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --bad: #f85149; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  #term { flex: 1; min-height: 0; padding: 4px 0 0 4px; }
  #bar { display: flex; gap: 6px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--panel);
    border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex: none; align-items: center; }
  #bar::-webkit-scrollbar { display: none; }
  #bar button, .dlg button { background: #21262d; color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font: 13px ui-monospace, Menlo, Consolas, monospace; white-space: nowrap; touch-action: manipulation; }
  #bar button:active { background: #30363d; }
  #bar .sep { width: 1px; align-self: stretch; background: var(--line); flex: none; }
  #bar a { color: var(--dim); font-size: 13px; white-space: nowrap; margin-left: auto; padding: 0 4px; text-decoration: none; }
  #state { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .shade { position: fixed; inset: 0; background: rgba(1, 4, 9, .72); display: flex; align-items: center;
    justify-content: center; padding: 16px; z-index: 10; }
  .dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; width: min(420px, 100%);
    box-sizing: border-box; }
  .dlg h1 { font-size: 17px; margin: 0 0 8px; }
  .dlg p { color: var(--dim); margin: 0 0 12px; }
  .dlg input { width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); font: 14px ui-monospace, Menlo, Consolas, monospace; margin-bottom: 10px; }
  .dlg .err { color: var(--bad); }
  .dlg button.go { background: #1f6feb; border-color: #1f6feb; }
  #copied { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; display: none; gap: 8px; align-items: center; z-index: 5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="term"></div>
<div id="bar">
  <span id="state">connecting…</span>
  <span class="sep"></span>
  <button data-k="esc">Esc</button><button data-k="tab">Tab</button>
  <button data-k="up">↑</button><button data-k="down">↓</button><button data-k="left">←</button><button data-k="right">→</button>
  <button data-k="enter">Enter</button><button data-k="pgup">PgUp</button><button data-k="pgdn">PgDn</button>
  <span class="sep"></span>
  <button data-k="f1">F1</button><button data-k="f2">F2</button><button data-k="f3">F3</button>
  <button data-k="f4">F4</button><button data-k="f5">F5</button><button data-k="f6">F6</button><button data-k="f7">F7</button>
  <span class="sep"></span>
  <button data-k="ctrl-t">Ctrl+T</button><button data-k="ctrl-y">Ctrl+Y</button>
  <span class="sep"></span>
  <button id="smaller" title="Smaller text">A−</button><button id="bigger" title="Bigger text">A+</button>
  <a href="/">Chat page</a>
</div>
<div id="copied"><span>ts5-tui copied some text.</span><button id="copy">Copy it</button><button id="nocopy">✕</button></div>
<div class="shade" id="keydlg" hidden>
  <form class="dlg" id="keyform">
    <h1>TokenStation5 terminal</h1>
    <p id="keywhy">This opens ts5-tui on your TokenStation5. It needs one of its API keys: ts5-tui's Access page (F6) makes them.</p>
    <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ts5-…">
    <button class="go" type="submit">Open</button>
  </form>
</div>
<div class="shade" id="msgdlg" hidden>
  <div class="dlg"><h1 id="msgtitle"></h1><p id="msgtext"></p><button class="go" id="again">Connect again</button></div>
</div>
<script src="/ts5/web/xterm.js"></script>
<script src="/ts5/web/addon-fit.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} },
};
const keys = {
  esc: "\x1b", tab: "\t", up: "\x1b[A", down: "\x1b[B", right: "\x1b[C", left: "\x1b[D", enter: "\r",
  pgup: "\x1b[5~", pgdn: "\x1b[6~", f1: "\x1bOP", f2: "\x1bOQ", f3: "\x1bOR", f4: "\x1bOS", f5: "\x1b[15~",
  f6: "\x1b[17~", f7: "\x1b[18~", "ctrl-t": "\x14", "ctrl-y": "\x19",
};
let size = parseInt(store.get("ts5.term.size"), 10) || (matchMedia("(max-width: 600px)").matches ? 11 : 14);
const term = new Terminal({
  fontFamily: 'ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace',
  fontSize: size, cursorBlink: true, allowProposedApi: true, scrollback: 0, macOptionIsMeta: true,
  theme: { background: "#0d1117", foreground: "#e6edf3" },
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open($("term"));
const enc = new TextEncoder();
let ws = null, ready = false, tries = 0, timer = 0, gaveKey = "";

function setState(t) { $("state").textContent = t; }
function refit() { try { fit.fit(); } catch (e) {} }
function send(text) { if (ws && ready && ws.readyState === 1) ws.send(enc.encode(text)); }
function sendSize() { if (ws && ready && ws.readyState === 1) ws.send(JSON.stringify({ cols: term.cols, rows: term.rows })); }

function askKey(why) {
  $("keywhy").textContent = why || $("keywhy").textContent;
  $("keywhy").className = why ? "err" : "";
  $("keydlg").hidden = false;
  $("key").value = "";
  setTimeout(() => $("key").focus(), 50);
}
function showMsg(title, text) {
  $("msgtitle").textContent = title;
  $("msgtext").textContent = text;
  $("msgdlg").hidden = false;
}

function openSocket() {
  clearTimeout(timer);
  const key = store.get("ts5.key");
  if (!key && location.hostname !== "127.0.0.1" && location.hostname !== "localhost") { askKey(); return; }
  $("msgdlg").hidden = true;
  setState(tries ? "connecting again…" : "connecting…");
  ready = false;
  gaveKey = key;
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ts5/terminal/socket");
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    refit();
    ws.send(JSON.stringify({ key, cols: term.cols, rows: term.rows }));
  };
  ws.onmessage = (ev) => {
    if (typeof ev.data !== "string") { term.write(new Uint8Array(ev.data)); return; }
    let m = {};
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.ready) { ready = true; tries = 0; setState("connected"); term.focus(); sendSize(); }
    if (m.error) {
      ready = false;
      if (/key/i.test(m.error)) { store.set("ts5.key", ""); askKey(m.error); }
      else showMsg("Can't open the terminal", m.error);
      ws.onclose = null;
    }
  };
  ws.onclose = (ev) => {
    const was = ready;
    ready = false;
    if (ev.code === 1000) { setState("ended"); showMsg("ts5-tui ended", "It was closed, or it quit. Its tmux session keeps an answer that was running."); return; }
    if (ev.code === 1001) { setState("off"); showMsg("Turned off", "The browser terminal was turned off on the Access page (F6)."); return; }
    // The server went away (a model being loaded starts it again), or the
    // page couldn't reach it: try again for a while.
    tries++;
    if (tries > 40) { setState("not connected"); showMsg("Not connected", "TokenStation5 doesn't answer. Is ts5 running, and is this device on the tailnet?"); return; }
    setState(was ? "reconnecting…" : "waiting for TokenStation5…");
    timer = setTimeout(openSocket, Math.min(1000 * tries, 5000));
  };
}

// Pages that say no plainly (the switch off, not from the tailnet) answer
// the WebSocket's request with an error before it opens: ask the page why.
async function why() {
  try {
    const r = await fetch("/ts5/terminal/socket");
    const j = await r.json();
    if (j.error) { showMsg("Can't open the terminal", j.error); return true; }
  } catch (e) {}
  return false;
}
async function connect() {
  if (await why()) return;
  openSocket();
}

term.onData((d) => send(d));
term.onBinary((d) => { if (ws && ready) ws.send(Uint8Array.from(d, (c) => c.charCodeAt(0))); });
term.onResize(() => sendSize());
new ResizeObserver(() => refit()).observe($("term"));
addEventListener("orientationchange", () => setTimeout(refit, 300));

// ts5-tui copies with OSC 52. A page over plain http may not write the
// clipboard by itself: then a tap on "Copy it" does.
let pending = "";
function copyNow(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(() => true, () => false);
  const t = document.createElement("textarea");
  t.value = text;
  t.style.position = "fixed"; t.style.opacity = "0";
  document.body.appendChild(t);
  t.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  t.remove();
  return Promise.resolve(ok);
}
term.parser.registerOscHandler(52, (data) => {
  const semi = data.indexOf(";");
  const b64 = semi < 0 ? "" : data.slice(semi + 1);
  if (!b64 || b64 === "?") return true;
  try {
    const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    pending = new TextDecoder().decode(bytes);
  } catch (e) { return true; }
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(pending).then(() => { setState("copied"); }, () => { $("copied").style.display = "flex"; });
  else $("copied").style.display = "flex";
  return true;
});
$("copy").onclick = () => { copyNow(pending).then((ok) => { setState(ok ? "copied" : "couldn't copy"); }); $("copied").style.display = "none"; term.focus(); };
$("nocopy").onclick = () => { $("copied").style.display = "none"; term.focus(); };

document.querySelectorAll("#bar button[data-k]").forEach((b) => {
  b.addEventListener("pointerdown", (e) => e.preventDefault());  // the keyboard stays up on a phone
  b.addEventListener("click", () => { send(keys[b.dataset.k]); term.focus(); });
});
function resize(by) {
  size = Math.max(8, Math.min(28, size + by));
  term.options.fontSize = size;
  store.set("ts5.term.size", String(size));
  refit();
}
$("smaller").onclick = () => resize(-1);
$("bigger").onclick = () => resize(1);
$("keyform").onsubmit = (e) => {
  e.preventDefault();
  const k = $("key").value.trim();
  if (!k) return;
  store.set("ts5.key", k);
  $("keydlg").hidden = true;
  tries = 0;
  connect();
};
$("again").onclick = () => { tries = 0; connect(); };
refit();
connect();
</script>
</body>
</html>
