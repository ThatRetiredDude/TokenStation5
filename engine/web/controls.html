<!-- The owner's phone controls: what ts5-tui's pages set, as buttons. Each
     tap is one request to /ts5/control, which hands it to the running
     ts5-tui (the same one the browser terminal shows); its answer is the
     whole state, drawn again. -->
<style>
  :root { --bg: #ffffff; --panel: #f6f8fa; --line: #d0d7de; --fg: #1f2328; --dim: #656d76; --accent: #0969da;
    --you: #ddf4ff; --bad: #cf222e; --good: #1a7f37; --warn: #9a6700; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --panel: #161b22; --line: #30363d; --fg: #e6edf3; --dim: #8b949e; --accent: #58a6ff;
      --you: #12263f; --bad: #f85149; --good: #3fb950; --warn: #d29922; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 10px 16px 0; padding-top: calc(10px + env(safe-area-inset-top)); }
  .bar { display: flex; align-items: center; gap: 10px; }
  .bar b { font-size: 16px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar a { border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 5px 10px; font-size: 13px;
    text-decoration: none; white-space: nowrap; }
  #status { color: var(--dim); font-size: 13px; margin: 4px 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav { display: flex; gap: 2px; overflow-x: auto; }
  nav button { flex: 1; background: none; border: none; border-bottom: 2px solid transparent; color: var(--dim);
    font: inherit; font-size: 15px; padding: 8px 6px; cursor: pointer; white-space: nowrap; }
  nav button.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
  main { max-width: 760px; margin: 0 auto; padding: 12px 16px calc(80px + env(safe-area-inset-bottom)); }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); margin: 20px 0 8px; font-weight: 600; }
  h2:first-child { margin-top: 4px; }
  .card { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: none; }
  .row .what { flex: 1; min-width: 0; }
  .row .what b { display: block; font-weight: 500; overflow-wrap: anywhere; }
  .row .what span { display: block; color: var(--dim); font-size: 13px; overflow-wrap: anywhere; }
  .row .val { color: var(--accent); font-weight: 500; }
  .row .what b span.tag, .row .what b span.val { display: inline-block; }
  .tag { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 10px; padding: 0 6px;
    margin-left: 6px; color: var(--dim); font-weight: 400; vertical-align: 1px; }
  .tag.on { border-color: var(--good); color: var(--good); }
  button.b { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px;
    padding: 7px 12px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
  button.b.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.b.bad { color: var(--bad); }
  button.b:disabled { opacity: .5; cursor: default; }
  .btns { display: flex; gap: 6px; flex: none; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; background: var(--panel); border: none; border-left: 1px solid var(--line); color: var(--fg);
    font: inherit; font-size: 14px; padding: 8px 4px; cursor: pointer; }
  .seg button:first-child { border-left: none; }
  .seg button.on { background: var(--accent); color: #fff; }
  .meter { height: 6px; border-radius: 3px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; margin-top: 6px; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .meter i.hot { background: var(--warn); }
  .meter i.bad { background: var(--bad); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .tile span { color: var(--dim); font-size: 13px; display: block; }
  .tile b { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile small { color: var(--dim); font-size: 13px; }
  .note { color: var(--dim); font-size: 13px; margin: 8px 2px; }
  .err { color: var(--bad); }
  input.t { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
    color: var(--fg); font: 15px ui-monospace, Menlo, Consolas, monospace; }
  .edit { display: flex; gap: 6px; padding: 0 12px 10px; }
  #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom));
    max-width: min(560px, calc(100% - 32px)); background: var(--fg); color: var(--bg); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; z-index: 30; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  .shade { position: fixed; inset: 0; background: rgba(1, 4, 9, .55); display: flex; align-items: center;
    justify-content: center; padding: 16px; z-index: 20; }
  .dlg { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 18px; width: min(460px, 100%);
    max-height: 90vh; overflow-y: auto; }
  .dlg h1 { font-size: 18px; margin: 0 0 8px; }
  .dlg p { color: var(--dim); margin: 0 0 14px; font-size: 14px; white-space: pre-wrap; }
  .dlg .btns { justify-content: flex-end; flex-wrap: wrap; }
  /* keep.js's own questions (save the key to the passwords?) */
  .dlg .row { border: none; padding: 0; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
  .dlg > .row button, .dlg form .row button { border: 1px solid var(--line); background: var(--panel); color: var(--fg);
    border-radius: 8px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .dlg .row button.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dlg input[type=password] { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); font: 16px ui-monospace, Menlo, Consolas, monospace; margin-bottom: 12px; }
  .dlg .pick { display: block; width: 100%; text-align: left; margin-bottom: 8px; }
  .dlg .pick span { display: block; color: var(--dim); font-size: 12px; white-space: normal; }
  .steps { padding: 6px 12px 10px; font-size: 14px; }
  .steps div { display: flex; gap: 8px; }
  .steps div span:last-child { color: var(--dim); margin-left: auto; text-align: right; }
  .row.key { padding-left: 28px; }
  .row.key .what b { font-weight: 400; }
  .tag.bad { border-color: var(--bad); color: var(--bad); }
  .tag.warn { border-color: var(--warn); color: var(--warn); }
  .warn { color: var(--warn); }
  form.add { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .back { background: none; border: none; color: var(--accent); font: inherit; font-size: 15px; padding: 4px 0; cursor: pointer; }
  .qr { background: #fff; border-radius: 10px; padding: 8px; width: min(300px, 100%); margin: 6px auto 10px; }
  .qr svg { display: block; width: 100%; height: auto; }
  .qrtext { font: 13px ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; cursor: pointer; user-select: all; }
  .dlg .seg { margin-bottom: 8px; }
  textarea.t { width: 100%; min-height: 96px; resize: vertical; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .fb { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .fb label { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .fb label span { color: var(--dim); font-size: 13px; }
  pre.report { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 55vh; overflow: auto; margin: 0 0 12px; }
  [hidden] { display: none !important; }
  /* Tasks: a running one's latest steps, an earlier one's answer. */
  pre.tail { margin: 0; padding: 10px 12px; border-top: 1px solid var(--line); font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere; color: var(--dim); max-height: 50vh; overflow-y: auto; }
  .row .what span.ans { color: var(--fg); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #newtask { border-top: none; flex-direction: column; }
  #newtask button { align-self: flex-end; }
</style>
</head>
<body>
<header>
  <div class="bar"><b>Controls</b><a href="/">Chat</a></div>
  <div id="status">…</div>
  <nav id="tabs">
    <button data-tab="models" class="on">Models</button>
    <button data-tab="machine">Machine</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="users">Users</button>
    <button data-tab="tasks">Tasks</button>
  </nav>
</header>
<main id="page"></main>
<div id="toast" role="status" hidden></div>
<div class="shade" id="askdlg" hidden><div class="dlg" id="ask"></div></div>
<div class="shade" id="keydlg" hidden><div class="dlg" id="keyshow"></div></div>
<div class="shade" id="fbdlg" hidden><div class="dlg" id="fbshow"></div></div>
<script src="/ts5/web/keep.js?v=4"></script>
<script src="/ts5/web/push.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = { get: (k) => TS5Keep.store.get(k, "") || "", set: (k, v) => TS5Keep.store.set(k, v ? v : null) };
TS5Keep.start();
let tab = store.get("ts5.controls.tab") || "models";
let st = null;          // ts5-tui's state, as its last answer gave it
let busy = false;       // a tap's request on its way (polls wait their turn)
let editing = null;     // the Settings row whose words are being typed (its index)
let problem = "";       // why the controls can't reach ts5-tui, if they can't
let loadAsked = null;   // {model, t}: a load asked for here (its server starts again)
let userOpen = null;    // the user whose page is open on Users (their id)
let keyFor = null;      // the user a new key's name is being typed for ("owner" for yours)
let madeKey = null;     // a new key's QR codes, shown this once (kept in this page alone, never stored)
let madeSel = 0;        // which of its codes shows
const fb = { text: "", logs: true, chat: false };  // /feedback being written (kept across redraws)
let fbReport = null;    // the report ts5-tui made, shown in full before it can be sent

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function gib(b) {
  if (!b) return "0";
  if (b >= 1 << 30) return (b / (1 << 30)).toFixed(1) + " GiB";
  return Math.round(b / (1 << 20)) + " MiB";
}
function n(v, d) { return v === null || v === undefined ? "–" : (d ? Number(v).toFixed(d) : Math.round(v)); }

async function send(req) {
  if (tab === "users" && req.users === undefined) req.users = true;
  if (tab === "tasks" && req.tasks === undefined) req.tasks = true;
  const h = { "Content-Type": "application/json" };
  const k = store.get("ts5.key");
  if (k) h.Authorization = "Bearer " + k;
  let r;
  try {
    r = await fetch("/ts5/control", { method: "POST", headers: h, body: JSON.stringify(req), cache: "no-store" });
  } catch (e) {
    // A model ts5-tui loads itself comes with a server of its own: this
    // one goes for a moment.
    problem = loadAsked && Date.now() - loadAsked.t < 180000
      ? "Loading " + loadAsked.model + ": the server starts again with it…"
      : "TokenStation5 doesn't answer (is the PS5 on, and this device on the tailnet?)";
    draw();
    return null;
  }
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok || j.error) {
    problem = j.error || ("The machine said " + r.status);
    if (r.status === 401) problem += " Open the chat page and sign in with your key first.";
    if (r.status !== 503 && j.state) st = j.state;
    draw();
    return null;
  }
  problem = "";
  if (k) TS5Keep.settled(k);
  // A new key's codes: shown, never kept in the state (or anywhere).
  if (j.made_key) { madeKey = j.made_key; madeSel = 0; delete j.made_key; }
  if (j.made) { userOpen = j.made; delete j.made; }
  if (typeof j.report === "string") { fbReport = j.report; delete j.report; }
  // The users stay as last read while a request without them is answered.
  if (!j.access && st && st.access && tab === "users") j.access = st.access;
  if (!j.tasks && st && st.tasks && tab === "tasks") j.tasks = st.tasks;
  st = j;
  if (loadAsked && j.server && j.server.online && j.server.model === loadAsked.model && !j.loading) loadAsked = null;
  draw();
  if (j.said) toast(j.said);
  return j;
}
// One request at a time, in the order asked: a tap during a poll waits
// for it, never dropped.
let chain = Promise.resolve();
function queue(req) {
  const p = chain.then(() => send(req));
  chain = p.catch(() => {});
  return p;
}
async function act(req) {
  busy = true;
  try { await queue(req); } finally { busy = false; }
}

let toastT = 0;
function toast(t) {
  if (!t) return;
  $("toast").textContent = t;
  $("toast").hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { $("toast").hidden = true; }, 5000);
}

// ---- the pages ----

function statusLine() {
  if (problem) return '<span class="err">' + esc(problem) + "</span>";
  if (!st) return "…";
  const s = st.server || {};
  if (st.loading) return "Loading " + esc(st.loading.model) + "… " + n(st.loading.secs) + " s";
  if (!s.online) return "No model loaded" + (s.why ? ": " + esc(s.why) : "");
  let t = esc(s.model) + (s.context ? " · " + n(s.context) + " context" : "");
  if (s.gen_tps) t += " · " + n(s.gen_tps, 1) + " tok/s";
  return t;
}

function setting(label) { return (st.settings || []).find((r) => r.label === label); }
function settingRow(r) {
  const open = editing === r.index;
  let h = '<div class="row"><div class="what"><b>' + esc(r.label) + ' <span class="val">' + esc(r.value) + "</span></b>" +
    (r.note ? "<span>" + esc(r.note) + "</span>" : "") + '</div><div class="btns">';
  if (r.change) h += '<button class="b" data-set="' + r.index + '" data-dir="-1" aria-label="Back">‹</button>' +
    '<button class="b" data-set="' + r.index + '" data-dir="1" aria-label="Next">›</button>';
  if (r.text) h += '<button class="b" data-edit="' + r.index + '">' + (open ? "Close" : "Edit") + "</button>";
  h += "</div></div>";
  if (r.text && open)
    h += '<form class="edit" data-save="' + r.index + '"><input class="t" name="v" ' +
      (r.secret ? 'type="password" placeholder="new value (the old one stays hidden)" autocomplete="off"'
                : 'type="text" value="' + esc(r.text_value || "") + '"') +
      ' autocapitalize="off" autocorrect="off" spellcheck="false"><button class="b go">Save</button></form>';
  return h;
}

function modelsPage() {
  const s = st.server || {};
  let h = "<h2>Loaded</h2><div class=\"card\">";
  if (st.loading) {
    h += '<div class="row"><div class="what"><b>Loading ' + esc(st.loading.model) + "…</b><span>" + n(st.loading.secs) +
      " s so far</span></div></div>";
  } else if (s.online) {
    h += '<div class="row"><div class="what"><b>' + esc(s.model) + "</b><span>" +
      (s.context ? n(s.context) + " tokens of context" : "") + (s.helper ? " · helper " + esc(s.helper) : "") +
      (s.gen_tps ? " · " + n(s.gen_tps, 1) + " tok/s writing, " + n(s.prompt_tps) + " reading" : "") +
      '</span></div><div class="btns"><button class="b bad" data-do="unload">Unload</button></div></div>';
  } else {
    h += '<div class="row"><div class="what"><b>None</b><span>' + esc(s.why || "Load one below.") + "</span></div></div>";
  }
  if (st.load_failed) h += '<div class="row"><div class="what err">' + esc(st.load_failed) + "</div></div>";
  for (const lbl of ["Context", "Speed or length"]) { const r = setting(lbl); if (r) h += settingRow(r); }
  h += "</div>";
  if (st.job) {
    const j = st.job;
    h += "<h2>" + esc(j.kind === "tune" ? "Tuning" : "Check") + " · " + esc(j.model) + '</h2><div class="card"><div class="steps">';
    for (const p of j.steps || [])
      h += "<div><span>" + ["○", "✱", "✓", "–", "✗"][p.state] + "</span><span>" + esc(p.label) + "</span><span>" + esc(p.result) + "</span></div>";
    h += "</div>" + (j.summary ? '<div class="row"><div class="what">' + esc(j.summary) + "</div></div>" : "") +
      (j.running ? '<div class="row"><div class="what"></div><button class="b bad" data-do="job_stop">Stop</button></div>' : "") + "</div>";
  }
  const models = st.models || [];
  h += "<h2>Downloaded (" + models.length + ")</h2><div class=\"card\">";
  if (!models.length) h += '<div class="row"><div class="what"><span>None yet: download one below.</span></div></div>';
  for (const m of models) {
    const missingHelper = m.helper && !m.helper_here;
    h += '<div class="row"><div class="what"><b>' + esc(m.name) + (m.loaded ? '<span class="tag on">loaded</span>' : "") +
      (m.tuned ? '<span class="tag">tuned</span>' : m.tested ? '<span class="tag">tested</span>' : "") + "</b><span>" + gib(m.bytes) +
      (m.helper ? " · helper " + esc(m.helper) + (m.helper_here ? "" : " (not here)") : "") + '</span></div><div class="btns">' +
      (missingHelper ? '<button class="b" data-do="helper" data-model="' + esc(m.name) + '">Helper</button>' : "") +
      (m.loaded ? "" : '<button class="b go" data-do="load" data-model="' + esc(m.name) + '">Load</button>') +
      (m.mine && !m.loaded ? '<button class="b bad" data-do="delete" data-model="' + esc(m.name) + '" aria-label="Delete">✕</button>' : "") +
      "</div></div>";
  }
  h += "</div>";
  if (st.download) {
    const d = st.download, pc = d.total ? Math.min(100, (100 * d.done) / d.total) : 0;
    h += '<h2>Downloading</h2><div class="card"><div class="row"><div class="what"><b>' + esc(d.name) + "</b><span>" + gib(d.done) +
      " of " + gib(d.total) + (d.mbps ? " · " + n(d.mbps, 1) + " MB/s" : "") + '</span><div class="meter"><i style="width:' + pc.toFixed(1) +
      '%"></i></div></div><button class="b bad" data-do="download_stop">Stop</button></div></div>';
  }
  const cat = st.catalog || [];
  if (cat.length) {
    h += "<h2>To download</h2><div class=\"card\">";
    for (const c of cat)
      h += '<div class="row"><div class="what"><b>' + esc(c.name) + "</b><span>" + esc(c.for) + " · " + gib(c.bytes) +
        '</span></div><button class="b" data-do="download" data-key="' + esc(c.key) + '"' + (st.download ? " disabled" : "") + ">" +
        (c.downloading ? "…" : "Download") + "</button></div>";
    h += "</div><p class=\"note\">" + gib(st.free_bytes) + " free for downloads.</p>";
  }
  return h;
}

function tile(label, value, unit, sub) {
  return '<div class="tile"><span>' + esc(label) + "</span><b>" + value + "</b>" + (unit ? " <small>" + unit + "</small>" : "") +
    (sub ? "<span>" + sub + "</span>" : "") + "</div>";
}
function meter(used, total) {
  const pc = total ? Math.min(100, (100 * used) / total) : 0;
  return '<div class="meter"><i class="' + (pc > 92 ? "bad" : pc > 80 ? "hot" : "") + '" style="width:' + pc.toFixed(1) + '%"></i></div>';
}
function machinePage() {
  const m = st.machine || {};
  let h = "<h2>Temperatures</h2><div class=\"grid\">" +
    tile("Chip (die)", n(m.die_c), "°C") + tile("Board", n(m.board_c), "°C") + (m.edge_c !== null && m.edge_c !== undefined ? tile("GPU edge", n(m.edge_c), "°C") : "") +
    "</div><h2>Fan</h2><div class=\"grid\">" + tile("Speed", n(m.fan_pct), "%", m.fan_rpm ? n(m.fan_rpm) + " rpm" : "") + "</div>";
  if (m.fan_control) {
    const modes = [["auto", "Auto"], ["cool", "Cool"], ["early", "Early"], ["max", "Max"]];
    h += '<div class="seg" style="margin-top:8px">' + modes.map(([k, l]) =>
      '<button data-fan="' + k + '" class="' + (m.fan_mode === k ? "on" : "") + '">' + l + "</button>").join("") + "</div>" +
      '<p class="note">Auto is the PS5\'s own curve; Cool and Early start the fan sooner; Max is full speed.</p>';
  } else {
    h += '<p class="note">The fan is set with TokenStation\'s hw helper, which the package installs.</p>';
  }
  // (The PS5's amdgpu gives neither: the section only where there is one.)
  const known = (v) => v !== null && v !== undefined;
  if (known(m.gpu_busy) || known(m.gpu_mhz))
    h += "<h2>GPU</h2><div class=\"grid\">" + (known(m.gpu_busy) ? tile("Busy", n(m.gpu_busy), "%") : "") +
      (known(m.gpu_mhz) ? tile("Clock", n(m.gpu_mhz), "MHz") : "") + "</div>";
  h += '<h2>Memory</h2><div class="card">';
  const mem = [["GPU memory (GTT)", m.gtt_used, m.gtt_total], ["VRAM", m.vram_used, m.vram_total],
    ["RAM", m.ram_total ? m.ram_total - m.ram_avail : 0, m.ram_total]];
  for (const [l, u, t] of mem)
    if (t) h += '<div class="row"><div class="what"><b>' + l + "</b><span>" + gib(u) + " used of " + gib(t) + "</span>" + meter(u, t) + "</div></div>";
  h += "</div>" + (m.gpu ? '<p class="note">' + esc(m.gpu) + "</p>" : "");
  return h;
}

// This device's own settings: its notifications, the chat page's (kept in
// this browser), and the key it keeps.
let notif = null;  // TS5Push.state(): {on, can, note}
let notifSaid = "";
let forgetArmed = false;
function headers() {
  const h = { "Content-Type": "application/json" };
  const k = store.get("ts5.key");
  if (k) h.Authorization = "Bearer " + k;
  return h;
}
async function notifRefresh() { notif = await TS5Push.state(headers); draw(); }
function deviceName() { return /iPhone/.test(navigator.userAgent) ? "This iPhone" : /iPad/.test(navigator.userAgent) ? "This iPad" : "This device"; }
function onOff(id, label, note, on) {
  return '<div class="row"><div class="what"><b>' + esc(label) + ' <span class="val">' + (on ? "on" : "off") + "</span></b>" +
    (note ? "<span>" + esc(note) + "</span>" : "") + '</div><div class="btns"><button class="b" data-mine="' + id + '">' +
    (on ? "Turn off" : "Turn on") + "</button></div></div>";
}
function devicePage() {
  let h = "<h2>" + esc(deviceName()) + '</h2><div class="card">';
  const nt = notif || { note: "…" };
  h += '<div class="row"><div class="what"><b>Notifications' + (nt.on ? ' <span class="val">on</span>' : "") + "</b><span>" +
    esc(notifSaid || nt.note) + '</span></div><div class="btns">' +
    (nt.can ? '<button class="b go" data-notif="on">Turn on</button>' : "") +
    (nt.on ? '<button class="b" data-notif="off">Turn off</button>' : "") + "</div></div>";
  h += onOff("think", "A thinking model thinks first", "On the chat page.", store.get("ts5.think") !== "0");
  h += onOff("showthink", "Show its thinking", "On the chat page.", store.get("ts5.showthink") === "1");
  const link = TS5Keep.how() === "link";
  h += '<div class="row"><div class="what"><b>The key in the chat page\'s link <span class="val">' + (link ? "yes, too" : "no") +
    "</span></b><span>" + (link ? "For a browser whose Home Screen icons don't get it." : "A Home Screen icon gets it anyway.") +
    '</span></div><div class="btns"><button class="b" data-mine="link">' + (link ? "No" : "Yes, too") + "</button></div></div>";
  h += '<div class="row"><div class="what"><b>The key</b><span>Kept in this browser only.</span></div><div class="btns">' +
    '<button class="b" data-mine="savepw">Save to passwords</button><button class="b bad" data-mine="forget">' +
    (forgetArmed ? "Tap again: forget it" : "Forget it") + "</button></div></div>";
  return h + "</div>";
}
function settingsPage() {
  let h = devicePage() + "<h2>ts5-tui's Settings</h2><div class=\"card\">";
  for (const r of st.settings || []) h += settingRow(r);
  h += "</div><p class=\"note\">The same rows as ts5-tui's Settings page: ‹ and › are its arrows. A change here is ts5-tui's, as if made there.</p>";
  return h + feedbackCard();
}

// /feedback, as ts5-tui's: what went wrong, the report made and cleaned on
// the machine, read here in full, then sent (or saved there, or dropped).
function feedbackCard() {
  const f = st.feedback || {};
  let h = '<h2>Feedback</h2><div class="card"><div class="fb">' +
    '<textarea class="t" id="fbtext" placeholder="What went wrong? Add an email if you\'d like a reply." maxlength="4000">' + esc(fb.text) + "</textarea>" +
    '<label><input type="checkbox" id="fblogs"' + (fb.logs ? " checked" : "") + '> The log\'s last lines <span>(cleaned)</span></label>' +
    '<label><input type="checkbox" id="fbchat"' + (fb.chat ? " checked" : "") + '> The chat open in ts5-tui <span>(cleaned)</span></label>' +
    '<div class="btns" style="justify-content:flex-end"><button class="b go" data-fbprep="1"' + (f.sending ? " disabled" : "") + ">Make the report</button></div>";
  if (f.sending) h += '<div class="note">Sending the report…</div>';
  else if (f.result) h += '<div class="note ' + (f.sent ? "" : "err") + '">' + esc(f.result) + "</div>";
  h += '</div></div><p class="note">You read the whole report before anything is sent. It goes only to TokenStation\'s developers, ' +
    "never anywhere public; keys, addresses, names and paths are taken out on the machine first.</p>";
  return h;
}
function utf8len(t) { return new TextEncoder().encode(t).length; }
function drawFb() {
  $("fbdlg").hidden = fbReport === null;
  if (fbReport === null) { $("fbshow").innerHTML = ""; return; }
  $("fbshow").innerHTML = "<h1>Send this report?</h1><p>Exactly what would be sent. " +
    (fb.chat ? "The chat open in ts5-tui is in it. " : "No chat is in it. ") + (fb.logs ? "The log's last lines are in it." : "The log is left out.") +
    '</p><pre class="report">' + esc(fbReport) + '</pre><div class="btns"><button class="b" data-fbcancel="1">Cancel</button>' +
    '<button class="b" data-fbsave="1">Save on the machine</button><button class="b go" data-fbsend="1">Send it</button></div>';
}


function ago(t) {
  if (!t) return "";
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 129600) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " days ago";
}
function keyRow(k) {
  return '<div class="row key"><div class="what"><b>' + esc(k.name) + (k.on ? "" : '<span class="tag bad">off</span>') + "</b><span>" +
    (k.used ? "used " + ago(k.used) : "not used yet") + (k.created ? " · made " + ago(k.created) : "") + '</span></div><div class="btns">' +
    '<button class="b" data-keyon="' + esc(k.id) + '" data-on="' + (k.on ? "0" : "1") + '">' + (k.on ? "Off" : "On") + "</button>" +
    '<button class="b bad" data-keyrm="' + esc(k.id) + '" aria-label="Remove the key">✕</button></div></div>';
}
function newKeyForm(uid, name) {
  if (keyFor !== uid)
    return '<div class="row"><div class="what"><span>A new key opens the chat page on ' + (uid === "owner" ? "your" : esc(name) + "'s") +
      " phone, signed in, by a QR code.</span></div><button class=\"b go\" data-newkey=\"" + esc(uid) + '">New key</button></div>';
  return '<form class="add" data-keyfor="' + esc(uid) + '"><input class="t" name="v" placeholder="what it is for (phone)" maxlength="60" ' +
    'autocapitalize="off" autocorrect="off" spellcheck="false"><button class="b go">Make it</button></form>';
}
function usersPage() {
  const a = st.access;
  if (!a) return '<p class="note">Asking ts5-tui for the users…</p>';
  if (a.kind === "remote") return '<p class="note">This ts5-tui works with a server on another machine: its users are made there.</p>';
  if (a.kind === "tv") return '<p class="note">The TV app makes its keys on its own Settings page, under Apps.</p>';
  if (a.error) return '<p class="note err">' + esc(a.error) + "</p>";
  const users = a.users || [];
  const open = users.find((u) => u.id === userOpen && !u.owner);
  if (open) return userPage(open);
  let h = "<h2>Users (" + users.length + ')</h2><div class="card">';
  for (const u of users) {
    const uid = u.owner ? "owner" : u.id;
    h += '<div class="row"><div class="what"><b>' + esc(u.owner ? u.name + " (you)" : u.name) +
      (!u.on ? '<span class="tag bad">paused</span>' : "") + (u.ended ? '<span class="tag bad">ended ' + esc(u.until) + "</span>" : "") +
      "</b><span>" + esc(u.summary) + "</span></div>" +
      (u.owner ? "" : '<button class="b" data-user="' + esc(u.id) + '">Edit</button>') + "</div>";
    for (const k of u.keys || []) h += keyRow(k);
    if (u.owner || keyFor === uid) h += newKeyForm(uid, u.name);
  }
  h += '<form class="add" id="adduser"><input class="t" name="v" placeholder="add someone: their name" maxlength="60" ' +
    'autocapitalize="words" autocorrect="off" spellcheck="false"><button class="b go">Add</button></form></div>';
  h += '<p class="note">A user gets the chat page and apps with their own key: never ts5-tui or the browser terminal. ' +
    (a.required ? "" : "Other machines don't need a key yet: Access in ts5-tui turns that on. ") +
    "A new key's QR codes show once; ts5 keeps only each key's SHA-256.</p>";
  return h;
}
function userPage(u) {
  let h = '<button class="back" data-user="">‹ Users</button><h2>' + esc(u.name) +
    (!u.on ? '<span class="tag bad">paused</span>' : "") + (u.ended ? '<span class="tag bad">ended</span>' : "") +
    '</h2><div class="card">';
  for (const r of u.rows || []) {
    h += '<div class="row"><div class="what"><b>' + esc(r.label) + ' <span class="val">' + esc(r.value) + "</span></b>" +
      (r.note ? '<span class="' + (r.warn ? "warn" : "") + '">' + esc(r.note) + "</span>" : "") + '</div><div class="btns">' +
      (r.pick ? '<button class="b" data-urow="' + r.row + '" data-dir="1">Choose</button>'
              : '<button class="b" data-urow="' + r.row + '" data-dir="-1" aria-label="Back">‹</button>' +
                '<button class="b" data-urow="' + r.row + '" data-dir="1" aria-label="Next">›</button>') + "</div></div>";
  }
  h += "</div><h2>" + esc(u.name) + "'s keys</h2><div class=\"card\">";
  for (const k of u.keys || []) h += keyRow(k);
  h += newKeyForm(u.id, u.name) + "</div>";
  h += '<p class="note">From the next request, on all ' + esc(u.name) + "'s keys. The same rows as " + esc(u.name) +
    "'s page on ts5-tui's Access.</p>" +
    '<div class="btns" style="justify-content:flex-end"><button class="b bad" data-userrm="' + esc(u.id) + '">Remove ' + esc(u.name) + "</button></div>";
  return h;
}

// Unattended tasks (ts5-tui's /task): the newest ten, the newest one's
// latest steps, Stop, and a new one.
let taskGoal = "";      // a new task's goal being typed (kept across redraws)
let stopArmed = "";     // the task whose Stop was tapped once (a second tap stops it)
function tasksPage() {
  const k = st.tasks;
  if (!k) return '<p class="note">Asking ts5-tui for the tasks…</p>';
  const list = k.list || [], run = list.find((t) => t.running);
  let h = "";
  if (run) {
    h += "<h2>Running</h2><div class=\"card\"><div class=\"row\"><div class=\"what\"><b>" + esc(run.goal) + "</b><span>" +
      esc(run.words) + " · " + esc(run.progress) + '</span></div><button class="b bad" data-taskstop="' + esc(run.id) + '">' +
      (stopArmed === run.id ? "Stop it?" : "Stop") + "</button></div>";
    if ((k.tail || []).length)
      h += '<pre class="tail">' + (k.tail || []).map(esc).join("\n") + "</pre>";
    h += "</div>";
  } else {
    const lim = k.limits || {};
    h += '<h2>New task</h2><div class="card"><form class="add" id="newtask"><textarea class="t" id="taskgoal" rows="3" ' +
      'placeholder="What the model should do, by itself, in the sandbox" maxlength="4000">' + esc(taskGoal) +
      '</textarea><button class="b go">Start</button></form><p class="note">It runs in the folder ts5-tui was started in, ' +
      "until it is done or reaches " + n(lim.steps) + " steps or " + esc(lim.hours) + " hours" +
      (lim.tokens ? " or " + n(lim.tokens) + " tokens" : "") + ". Nobody is asked anything; you get a notification when it ends.</p></div>";
  }
  const past = list.filter((t) => !t.running);
  if (past.length) {
    h += "<h2>Earlier</h2><div class=\"card\">";
    for (const t of past)
      h += '<div class="row"><div class="what"><b>' + esc(t.goal) + "</b><span>" + esc(t.words) + " · " + esc(t.progress) +
        (t.answer ? "</span><span class=\"ans\">" + esc(t.answer) : "") + "</span></div></div>";
    h += "</div>";
  }
  if (!run && past.length && (k.tail || []).length)
    h += '<h2>The last one\'s last steps</h2><div class="card"><pre class="tail">' + (k.tail || []).map(esc).join("\n") + "</pre></div>";
  return h;
}

// A QR code from its modules ("0"/"1" rows), with its quiet zone.
function qrSvg(rows) {
  const n = rows.length, q = 4;
  let d = "";
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] === "1") d += "M" + (x + q) + " " + (y + q) + "h1v1h-1z"; });
  return '<svg viewBox="0 0 ' + (n + 2 * q) + " " + (n + 2 * q) + '" shape-rendering="crispEdges" role="img" aria-label="QR code">' +
    '<rect width="100%" height="100%" fill="#fff"/><path fill="#000" d="' + d + '"/></svg>';
}
function drawKey() {
  $("keydlg").hidden = !madeKey;
  if (!madeKey) { $("keyshow").innerHTML = ""; return; }
  const codes = madeKey.codes || [];
  const c = codes[Math.min(madeSel, codes.length - 1)] || {};
  let h = "<h1>" + esc((madeKey.title || "A new key").trim()) + "</h1>";
  if (codes.length > 1)
    h += '<div class="seg">' + codes.map((x, i) => '<button data-code="' + i + '" class="' + (i === madeSel ? "on" : "") + '">' +
      esc(x.label.split(":")[0]) + "</button>").join("") + "</div>";
  if (c.modules && c.modules.length) h += '<div class="qr">' + qrSvg(c.modules) + "</div>";
  h += '<div class="qrtext" data-copy="1" title="Tap to copy">' + esc(c.text || "") + "</div>";
  for (const t of madeKey.notes || []) h += "<p>" + esc(t) + "</p>";
  h += '<div class="btns"><button class="b go" data-keydone="1">Done</button></div>';
  $("keyshow").innerHTML = h;
}

function draw() {
  $("status").innerHTML = statusLine();
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.tab === tab);
  // Typing in a box: not drawn over until it is saved or closed.
  if (document.activeElement && document.activeElement.classList.contains("t")) return;
  if (!st) {
    // No answer from ts5-tui (it isn't running, under the background
    // service; or not yet): this device's own rows need none of it.
    $("page").innerHTML = (problem ? '<p class="note err">' + esc(problem) + "</p>" : '<p class="note">Asking ts5-tui…</p>') +
      (tab === "settings" ? devicePage()
        : problem ? '<p class="note">This device\'s own settings (notifications, the chat page\'s, the key) are under Settings.</p>' : "");
  } else {
    $("page").innerHTML = tab === "machine" ? machinePage() : tab === "settings" ? settingsPage() : tab === "users" ? usersPage()
      : tab === "tasks" ? tasksPage() : modelsPage();
  }
  drawAsk();
  drawKey();
  drawFb();
}

// A question ts5-tui asks (delete this model? load with less context?):
// answered here, as its keys would.
function drawAsk() {
  const a = st && st.ask;
  $("askdlg").hidden = !a;
  if (!a) return;
  let h = "<h1>" + esc(a.title || "ts5-tui asks") + "</h1>" + (a.text ? "<p>" + esc(a.text) + "</p>" : "");
  if (a.picks && a.picks.length) {
    a.picks.forEach((p, i) => {
      h += '<button class="b pick" data-pick="' + i + '"><b>' + esc(p.label) + "</b>" + (p.note ? "<span>" + esc(p.note) + "</span>" : "") + "</button>";
    });
  } else {
    h += '<div class="btns"><button class="b" data-yes="0">No</button><button class="b go" data-yes="1">Yes</button></div>';
  }
  $("ask").innerHTML = h;
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.tab) {
    tab = t.dataset.tab; store.set("ts5.controls.tab", tab); editing = null; userOpen = null; keyFor = null; draw();
    if (tab === "users") act({ do: "users" });
    if (tab === "tasks") act({ do: "tasks" });
    if (tab === "settings") notifRefresh();
    return;
  }
  if (t.dataset.user !== undefined) { userOpen = t.dataset.user || null; keyFor = null; draw(); window.scrollTo(0, 0); return; }
  if (t.dataset.newkey !== undefined) {
    keyFor = t.dataset.newkey; draw();
    const box = document.querySelector("form.add[data-keyfor] input");
    if (box) box.focus();
    return;
  }
  if (t.dataset.urow !== undefined) {
    const u = ((st.access || {}).users || []).find((x) => x.id === userOpen);
    const r = u && (u.rows || []).find((x) => x.row === +t.dataset.urow);
    if (r) act({ do: "user_row", id: u.id, row: r.row, label: r.label, dir: +t.dataset.dir });
    return;
  }
  if (t.dataset.userrm !== undefined) { act({ do: "user_remove", id: t.dataset.userrm }); return; }
  if (t.dataset.taskstop !== undefined) {
    if (stopArmed !== t.dataset.taskstop) {
      stopArmed = t.dataset.taskstop; draw();
      setTimeout(() => { stopArmed = ""; draw(); }, 4000);
    } else { stopArmed = ""; act({ do: "task_stop", id: t.dataset.taskstop }); }
    return;
  }
  if (t.dataset.keyon !== undefined) { act({ do: "key_on", id: t.dataset.keyon, on: t.dataset.on === "1" }); return; }
  if (t.dataset.keyrm !== undefined) { act({ do: "key_remove", id: t.dataset.keyrm }); return; }
  if (t.dataset.code !== undefined) { madeSel = +t.dataset.code; drawKey(); return; }
  if (t.dataset.keydone !== undefined) { madeKey = null; drawKey(); return; }
  if (t.dataset.notif !== undefined) {
    if (t.dataset.notif === "on") TS5Push.on(headers).then((said) => { notifSaid = said; notifRefresh(); });
    else TS5Push.off(headers).then(() => { notifSaid = ""; notifRefresh(); });
    return;
  }
  if (t.dataset.mine !== undefined) {
    const m = t.dataset.mine;
    if (m === "think") store.set("ts5.think", store.get("ts5.think") === "0" ? "1" : "0");
    if (m === "showthink") store.set("ts5.showthink", store.get("ts5.showthink") === "1" ? "0" : "1");
    if (m === "link") TS5Keep.change(TS5Keep.how() === "link" ? "passwords" : "link", store.get("ts5.key"));
    if (m === "savepw" && store.get("ts5.key")) TS5Keep.save(store.get("ts5.key"));
    if (m === "forget") {
      if (!forgetArmed) { forgetArmed = true; setTimeout(() => { forgetArmed = false; draw(); }, 4000); }
      else {
        // (This device's notifications go off with the key: the machine forgets it.)
        forgetArmed = false;
        TS5Push.off(headers).catch(() => {}).then(() => { TS5Keep.forget(); location.href = "/"; });
        return;
      }
    }
    draw();
    return;
  }
  if (t.dataset.fbprep !== undefined) {
    if (!fb.text.trim()) { toast("Write what went wrong first"); return; }
    act({ do: "feedback_prepare", summary: fb.text, logs: fb.logs, chat: fb.chat });
    return;
  }
  if (t.dataset.fbcancel !== undefined) { fbReport = null; drawFb(); return; }
  if (t.dataset.fbsave !== undefined || t.dataset.fbsend !== undefined) {
    const len = utf8len(fbReport || "");
    const send = t.dataset.fbsend !== undefined;
    fbReport = null;
    drawFb();
    if (send) fb.text = "";
    act({ do: send ? "feedback_send" : "feedback_save", length: len });
    return;
  }
  if (t.dataset.do) {
    const req = { do: t.dataset.do };
    if (t.dataset.model) req.model = t.dataset.model;
    if (req.do === "load") loadAsked = { model: req.model, t: Date.now() };
    if (t.dataset.key) req.key = t.dataset.key;
    act(req);
  } else if (t.dataset.fan) {
    act({ do: "fan", mode: t.dataset.fan });
  } else if (t.dataset.set !== undefined) {
    const r = st.settings[+t.dataset.set];
    act({ do: "setting", index: r.index, label: r.label, dir: +t.dataset.dir });
  } else if (t.dataset.edit !== undefined) {
    editing = editing === +t.dataset.edit ? null : +t.dataset.edit;
    draw();
    const box = document.querySelector("form.edit input");
    if (box) box.focus();
  } else if (t.dataset.yes !== undefined || t.dataset.pick !== undefined) {
    // The answer goes with the question it is to: one answered on the TV
    // meanwhile, with another asked there since, isn't answered by this tap.
    const a = (st && st.ask) || {};
    const req = { do: "answer", title: a.title || "", text: a.text || "" };
    if (t.dataset.yes !== undefined) req.yes = t.dataset.yes === "1"; else req.pick = +t.dataset.pick;
    act(req);
  }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "newtask") {
    e.preventDefault();
    const v = taskGoal.trim();
    document.activeElement.blur();
    if (!v) { toast("Write what the task is first"); return; }
    taskGoal = "";
    act({ do: "task_start", goal: v });
    return;
  }
  if (e.target.id === "adduser" || e.target.dataset.keyfor !== undefined) {
    e.preventDefault();
    const f = e.target, v = f.elements.v.value.trim();
    document.activeElement.blur();
    if (f.id === "adduser") { if (v) act({ do: "user_new", name: v }); }
    else { keyFor = null; act({ do: "key_new", user: f.dataset.keyfor, name: v || "phone" }); }
    return;
  }
  const f = e.target.closest("form.edit");
  if (!f) return;
  e.preventDefault();
  const r = st.settings[+f.dataset.save];
  const v = f.elements.v.value;
  editing = null;
  document.activeElement.blur();
  act({ do: "setting", index: r.index, label: r.label, text: v });
});

// What is written for /feedback, kept as it is typed (a redraw keeps it).
document.addEventListener("input", (e) => {
  if (e.target.id === "fbtext") fb.text = e.target.value;
  if (e.target.id === "taskgoal") taskGoal = e.target.value;
});
document.addEventListener("change", (e) => {
  if (e.target.id === "fblogs") fb.logs = e.target.checked;
  if (e.target.id === "fbchat") fb.chat = e.target.checked;
});

// A tap on a new key's text copies it (or selects it, where the browser
// won't copy: a page on http).
document.addEventListener("click", (e) => {
  const el = e.target.closest(".qrtext");
  if (!el) return;
  const pick = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(el.textContent).then(() => toast("Copied"), () => { pick(); toast("Selected: copy it"); });
  else { pick(); toast("Selected: copy it"); }
});

// The state again every 2 s while the page is in view (each second while a
// model loads or downloads), never two requests at once.
async function poll() {
  if (!document.hidden && !busy) await queue({ do: "state" }).catch(() => {});
  const quick = loadAsked || (st && (st.loading || st.download || (st.job && st.job.running)));
  setTimeout(poll, quick ? 1000 : 2000);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (!busy) queue({ do: "state" });
  TS5Push.seen();
  fetch("/ts5/away", { method: "POST", headers: headers(), body: JSON.stringify({ away: false }) }).catch(() => {});
});
if (!store.get("ts5.key") && location.hostname !== "127.0.0.1" && location.hostname !== "localhost") {
  problem = "No key in this browser yet: open the chat page and sign in with your key, then come back.";
}
// A task's notification opens Tasks.
if (location.hash === "#tasks") tab = "tasks";
if (!["models", "machine", "settings", "users", "tasks"].includes(tab)) tab = "models";
draw();
poll();
notifRefresh();
TS5Push.sync(headers);
TS5Push.opened((d) => { location.href = d.url || "/" + (d.chat ? "#chat=" + encodeURIComponent(d.chat) : ""); });
</script>
</body>
</html>
