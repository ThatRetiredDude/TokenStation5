name: steam

# Builds the Steam depot (steam/linux/build-depot.sh) in the Steam Runtime 3
# (sniper) SDK image, then runs it there, as in the container Steam itself
# runs the app in, and checks that it starts and serves the API.
# The depot is an artifact; uploading it to Steam is steam/steampipe/
# upload.sh, by hand, with the Steamworks build account.

on:
  push:
    branches: [steam]
    paths: ["engine/**", "ps5/**", "linux/**", "steam/**", "third_party/**", ".github/workflows/steam.yml"]
  pull_request:
    paths: ["engine/**", "ps5/**", "linux/**", "steam/**", "third_party/**", ".github/workflows/steam.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Built and run in the Steam Runtime 3 (sniper) SDK image: the same
  # Debian 11 libraries Steam gives the app.
  depot:
    runs-on: ubuntu-24.04
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: The SDK's compilers and glslang
        run: |
          grep -E '^(PRETTY_NAME|BUILD_ID)=' /etc/os-release
          ls /usr/bin | grep -E '^(gcc|g\+\+)(-[0-9]+)?$' || true
          glslangValidator --version | head -1
      - name: Build the depot
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          steam/linux/build-depot.sh "0.0.0+$(git rev-parse --short HEAD)"
          find build/steam/linux/depot -type f | sort
      - name: It loads with sniper's libraries
        run: |
          depot=build/steam/linux/depot
          if ldd $depot/bin/tokenstation $depot/bin/ts5 | grep "not found"; then exit 1; fi
          $depot/launch.sh --version
      - name: Fill the SteamPipe scripts (no upload)
        run: |
          mkdir -p /tmp/steamcmd && printf '#!/bin/sh\necho "steamcmd $*"\n' > /tmp/steamcmd/steamcmd && chmod +x /tmp/steamcmd/steamcmd
          STEAMCMD=/tmp/steamcmd/steamcmd STEAM_APP_ID=480 STEAM_DEPOT_ID=481 STEAM_USER=ci steam/steampipe/upload.sh
          cat build/steam/steampipe/app_build.vdf build/steam/steampipe/depot_build.vdf
      - name: Pack it (keeps the execute bits)
        run: tar -C build/steam/linux -czf build/steam/linux/depot.tar.gz depot
      - uses: actions/upload-artifact@v4
        with:
          name: tokenstation-steam-depot
          path: build/steam/linux/depot.tar.gz

  # The depot run the way Steam runs it: Valve's sniper container
  # (pressure-vessel), with the machine's own GPU driver passed in. Here
  # that's Ubuntu 24.04's lavapipe; sniper's own Mesa is too old for the
  # engine, and Steam never uses it for the GPU either.
  run:
    needs: depot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tokenstation-steam-depot
      - name: Lavapipe, and the sniper container runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers bubblewrap
          # pressure-vessel needs unprivileged user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          curl -fsSL -o slr.tar.xz https://repo.steampowered.com/steamrt-images-sniper/snapshots/latest-container-runtime-public-beta/SteamLinuxRuntime_sniper.tar.xz
          tar xf slr.tar.xz
          tar xzf depot.tar.gz
      - name: Run it in sniper
        run: |
          data=$HOME/ts5-data && mkdir -p "$data"
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy TS5_DESKTOP_NOTIFY=0
          SteamLinuxRuntime_sniper/run -- cat /etc/os-release | head -2
          SteamLinuxRuntime_sniper/run -- "$PWD/depot/launch.sh" --data "$data" --windowed & pid=$!
          up=
          for _ in $(seq 1 600); do
            if grep -q "ts5-title: TokenStation5 " "$data/ts5.log" 2> /dev/null &&
               curl -s -o /dev/null http://127.0.0.1:8081/v1/models; then up=1; break; fi
            kill -0 $pid 2> /dev/null || break
            sleep 0.1
          done
          tail -40 "$data/ts5.log" || true
          [ -n "$up" ] || { echo "it didn't come up in the sniper runtime"; exit 1; }
          grep -q "no GPU" "$data/ts5.log" && exit 1
          touch "$data/quit"
          for _ in $(seq 1 100); do kill -0 $pid 2> /dev/null || break; sleep 0.1; done
          kill -0 $pid 2> /dev/null && { echo "it didn't quit"; kill $pid; exit 1; }
          grep -q "leaving (exit)" "$data/ts5.log"
