name: linux

# Builds TokenStation for Linux once, on Debian 12 (linux/build-deb.sh), and
# packages that one build for Debian and Ubuntu (.deb), Fedora (.rpm), Arch
# (.pkg.tar.zst) and Bazzite or SteamOS (the portable .tar.gz with
# install.sh), then installs each on its own distribution and checks it.
# On a linux-v<version> tag it also publishes a GitHub Release with all four. These releases are never marked "latest", so the PS5 store side
# (release.yml) keeps pointing at the PS5 title.
#
#   git tag linux-v0.1.0 && git push origin linux-v0.1.0
#
# Run by hand (workflow_dispatch), it instead replaces the "linux-latest"
# pre-release with this build, under fixed names too, so a PS5 can install
# the newest build with one command and no GitHub sign-in:
#
#   curl -LO https://github.com/ThatRetiredDude/TokenStation5/releases/download/linux-latest/tokenstation_latest_amd64.deb

on:
  push:
    branches: [main]
    tags: ["linux-v*"]
    paths: ["engine/**", "ps5/**", "linux/**", "third_party/**", ".github/workflows/linux.yml"]
  pull_request:
    paths: ["engine/**", "ps5/**", "linux/**", "third_party/**", ".github/workflows/linux.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # Built on Debian 12, the oldest system it supports, so the same programs
  # run there and on anything newer.
  package:
    runs-on: ubuntu-24.04
    container: debian:12
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates curl bzip2 xz-utils python3 make cmake g++ glslang-tools libvulkan-dev libsdl2-dev dpkg-dev sudo binutils
      - uses: actions/checkout@v4
      - name: Build the package
        id: build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # A version that only goes up, so "install it again" is an upgrade on
          # apt, dnf and pacman: <the newest linux-v tag>.<run number>+<commit>,
          # which sorts after that release and before the next one. Before the
          # first tag it is 0.0.1.<run number>+<commit>: after the
          # 0.0.0+<commit> builds before it, and before a linux-v0.1.0.
          if [[ "$GITHUB_REF" == refs/tags/linux-v* ]]; then
            v=${GITHUB_REF_NAME#linux-v}
          else
            base=$(git ls-remote --tags --refs origin 'linux-v*' 2>/dev/null | sed 's#.*refs/tags/linux-v##' | sort -V | tail -n 1 || true)
            v=${base:-0.0.1}.${GITHUB_RUN_NUMBER}+$(git rev-parse --short HEAD)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          linux/build-deb.sh "$v"
      - name: Check the package
        run: |
          deb=$(ls build/linux/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          dpkg-deb -x "$deb" /tmp/pkg
          for f in usr/lib/tokenstation/start.sh usr/lib/tokenstation/boost.sh usr/bin/tokenstation-cu \
                   usr/bin/tokenstation-memory usr/lib/tokenstation/hw usr/lib/tokenstation/system-setup; do
            sh -n /tmp/pkg/$f
          done
          sh -n linux/files/install.sh
          test -x /tmp/pkg/usr/lib/tokenstation/gpu-selftest
          { /tmp/pkg/usr/bin/ts5 2>&1 || true; } | grep -q "usage: ts5"
          visudo -cf /tmp/pkg/etc/sudoers.d/tokenstation
          /tmp/pkg/usr/lib/tokenstation/hw status
          /tmp/pkg/usr/bin/tokenstation --version | grep -q "^tokenstation "
          tar -tzf build/linux/tokenstation-*-linux-*.tar.gz
          # Nothing newer than Debian 12's C library (2.36).
          if objdump -T /tmp/pkg/usr/bin/tokenstation /tmp/pkg/usr/bin/ts5 | grep -E "GLIBC_2\.(3[7-9]|[4-9][0-9])"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: tokenstation-debian-ubuntu
          path: build/linux/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: tokenstation-bazzite-steamos
          path: build/linux/tokenstation-*-linux-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: root
          path: build/linux/tokenstation-root.tar.gz
          retention-days: 3

  # The newest published build, for the upgrade tests below. It comes from the
  # run that published it and not from the release page: a file fetched from
  # the release counts as a download, and the tests would bury the real ones.
  published:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch it from the run that published it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p old
          sha=$(gh release view linux-latest --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          if [ -z "$sha" ]; then
            echo "Nothing is published yet: the upgrade tests are left out."
            exit 0
          fi
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow linux.yml --event workflow_dispatch \
                  --commit "$sha" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --dir old \
              -n tokenstation-debian-ubuntu -n tokenstation-fedora -n tokenstation-arch || true
          fi
          find old -type f | sort
          if [ -z "$(find old -type f | head -1)" ]; then
            echo "::warning::The published build ($sha) could not be fetched from the run that made it: the upgrade tests are left out."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: published
          path: old
          if-no-files-found: ignore
          retention-days: 1

  # The .deb, installed with apt on each Debian and Ubuntu.
  deb:
    needs: [package, published]
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:24.04", "ubuntu:26.04"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tokenstation-debian-ubuntu
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: published
          path: old
      - name: Install it and check it
        run: |
          apt-get update -qq
          apt-get install -y -qq sudo python3 curl ca-certificates
          # An upgrade from the newest published build, when there is one.
          old=$(find "$PWD/old" -name 'tokenstation_*_amd64.deb' 2>/dev/null | head -1)
          if [ -n "$old" ]; then
            apt-get install -y -qq "$old"
            dpkg-query -W tokenstation
          fi
          apt-get install -y -qq ./dist/*.deb
          dpkg-query -W tokenstation
          test "$(stat -c %a /var/lib/tokenstation/models)" = 2775
          tokenstation --version
          { ts5 2>&1 || true; } | grep -q "usage: ts5"
          ts5-tune --help | grep -q "fastest GPU settings"
          id tokenstation
          sudo -l -U tokenstation | grep -q /usr/lib/tokenstation/hw
          sudo -u tokenstation sudo -n /usr/lib/tokenstation/hw status
          apt-get remove -y -qq tokenstation

  # The same build, made into an .rpm on Fedora, then installed with dnf.
  fedora:
    needs: [package, published]
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: root
          path: build/linux
      - name: Build the .rpm
        run: |
          dnf install -y -q rpm-build
          linux/build-rpm.sh "${{ needs.package.outputs.version }}"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: published
          path: old
      - name: Install it and check it
        run: |
          # An upgrade from the newest published build, when there is one.
          old=$(find "$PWD/old" -name 'tokenstation-*.x86_64.rpm' 2>/dev/null | head -1)
          if [ -n "$old" ]; then
            dnf install -y -q "$old"
            rpm -q tokenstation
          fi
          dnf install -y -q ./build/linux/tokenstation-*.rpm
          rpm -q tokenstation
          test "$(stat -c %a /var/lib/tokenstation/models)" = 2775
          tokenstation --version
          { ts5 2>&1 || true; } | grep -q "usage: ts5"
          ts5-tune --help | grep -q "fastest GPU settings"
          id tokenstation
          sudo -l -U tokenstation | grep -q /usr/lib/tokenstation/hw
          sudo -u tokenstation sudo -n /usr/lib/tokenstation/hw status
          dnf remove -y -q tokenstation
      - uses: actions/upload-artifact@v4
        with:
          name: tokenstation-fedora
          path: build/linux/tokenstation-*.rpm

  # And into an Arch package, installed with pacman.
  arch:
    needs: [package, published]
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: root
          path: build/linux
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder build/linux
          su builder -c "linux/build-arch.sh '${{ needs.package.outputs.version }}'"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: published
          path: old
      - name: Install it and check it
        run: |
          # An upgrade from the newest published build, when there is one.
          old=$(find "$PWD/old" -name 'tokenstation-*.pkg.tar.*' 2>/dev/null | head -1)
          if [ -n "$old" ]; then
            pacman -U --noconfirm "$old"
            pacman -Q tokenstation
          fi
          pacman -U --noconfirm build/linux/tokenstation-*.pkg.tar.*
          pacman -Q tokenstation
          test "$(stat -c %a /var/lib/tokenstation/models)" = 2775
          tokenstation --version
          { ts5 2>&1 || true; } | grep -q "usage: ts5"
          id tokenstation
          sudo -l -U tokenstation | grep -q /usr/lib/tokenstation/hw
          sudo -u tokenstation sudo -n /usr/lib/tokenstation/hw status
          pacman -R --noconfirm tokenstation
      - uses: actions/upload-artifact@v4
        with:
          name: tokenstation-arch
          path: build/linux/tokenstation-*.pkg.tar.*

  # The portable build on Fedora 44, as on Bazzite: install.sh as a user.
  portable:
    needs: package
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tokenstation-bazzite-steamos
          path: dist
      - name: Install it with install.sh
        run: |
          dnf install -y -q SDL2 vulkan-loader sudo tar findutils shadow-utils util-linux
          useradd -m tester
          echo "tester ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/tester
          tar -C /home/tester -xzf dist/tokenstation-*-linux-*.tar.gz
          chown -R tester /home/tester
          su - tester -c 'cd tokenstation-linux-amd64 && ./install.sh'
          # An update: the same tarball unpacked over it, then install.sh again.
          tar -C /home/tester -xzf dist/tokenstation-*-linux-*.tar.gz
          chown -R tester /home/tester
          su - tester -c 'cd tokenstation-linux-amd64 && ./install.sh --no-start'
          su - tester -c '~/.local/bin/tokenstation --version'
          su - tester -c '~/.local/bin/ts5 2>&1 | grep -q "usage: ts5"'
          test -x /usr/local/lib/tokenstation/hw
          id -nG tester | grep -q tokenstation
          sudo -l -U tester | grep -q /usr/local/lib/tokenstation/hw
          su - tester -c 'sudo -n /usr/local/lib/tokenstation/hw status'
          grep -q "Exec=/home/tester/.local/opt/tokenstation/bin/tokenstation" /home/tester/.local/share/applications/tokenstation.desktop
          su - tester -c 'cd tokenstation-linux-amd64 && ./install.sh --uninstall'
          test ! -e /usr/local/lib/tokenstation

  # The .deb on Ubuntu 24.04 running a model end to end.
  run-ubuntu:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tokenstation-debian-ubuntu
          path: dist
      - name: Install it
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers ./dist/*.deb
          # The API-only service would want port 8081, which the test uses.
          sudo systemctl disable --now tokenstation.service || true
      - name: Run the app (lavapipe, no screen)
        run: |
          python3 -m pip install --user --break-system-packages -q gguf
          mkdir -p /tmp/model
          curl -fsSL -o /tmp/model/vocab.gguf https://raw.githubusercontent.com/ggml-org/llama.cpp/master/models/ggml-vocab-qwen2.gguf
          python3 engine/tests/make_test_model.py --arch qwen2 --vocab /tmp/model/vocab.gguf --quant Q4_K_M /tmp/model/test.gguf
          linux/smoke-test.sh /tmp/model/test.gguf /usr/bin/tokenstation
      - name: The model's browser (ts5 browser, pages served here; the text view, then the runner's Chrome)
        env:
          # The runner's Chrome is not ours to set up: its sandbox is left out here.
          TS5_BROWSER_NO_SANDBOX: "1"
        run: |
          browser=$(command -v google-chrome chromium chromium-browser | head -1 || true)
          echo "browser: ${browser:-none, so the text view only}"
          python3 engine/tests/browser_test.py "$(command -v ts5)" $browser
      - name: API keys (ts5 keys, and ts5 serve letting another machine in by them)
        run: python3 engine/tests/access_test.py "$(command -v ts5)" /tmp/model/test.gguf vk
      - name: Outside tools (ts5-tui --mcp against an MCP server served here, no model)
        run: python3 linux/tui/test/mcp_test.py "$(command -v ts5-tui)"
      - name: Tune it (ts5-tune, then the engine reads tune.env; --models, then the per-model file)
        run: |
          ts5-tune --quick --pp 64 --tg 16 /tmp/model/test.gguf
          mkdir -p ~/.config/tokenstation
          echo TS5_MV_ROWS=8 > ~/.config/tokenstation/tune.env
          ts5 bench -m /tmp/model/test.gguf --pp 16 --tg 4 2>&1 | tee /tmp/bench.txt
          grep -q "tuning from $HOME/.config/tokenstation/tune.env: TS5_MV_ROWS=8" /tmp/bench.txt
          TS5_MV_ROWS=2 ts5 bench -m /tmp/model/test.gguf --pp 16 --tg 4 2>&1 | grep -q "(nothing new)"
          ts5-tune --reset
          test ! -e ~/.config/tokenstation/tune.env
          # Each model's own settings: written, read when that model loads, deleted.
          # With the progress lines ts5-tui shows: a plan, each step, a summary.
          TS5_TUNE_PROGRESS=1 ts5-tune --models --tokens 16 /tmp/model/test.gguf | tee /tmp/tune.txt
          grep -q '^@ts5-tune {"event": "plan"' /tmp/tune.txt
          grep -q '^@ts5-tune {"event": "step", "step": 1, "state": "done"' /tmp/tune.txt
          grep -q '^@ts5-tune {"event": "summary"' /tmp/tune.txt
          grep -q "^size=$(stat -c %s /tmp/model/test.gguf)$" ~/.config/tokenstation/tune/test.gguf.env
          ts5 bench -m /tmp/model/test.gguf --pp 16 --tg 4 2>&1 |
            grep -q "settings for test.gguf from $HOME/.config/tokenstation/tune/test.gguf.env"
          ts5-tune --models --reset /tmp/model/test.gguf
          test ! -e ~/.config/tokenstation/tune/test.gguf.env

  release:
    if: startsWith(github.ref, 'refs/tags/linux-v')
    needs: [package, deb, fedora, arch, portable, run-ubuntu]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tokenstation-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "TokenStation for Linux ${GITHUB_REF_NAME#linux-v}" \
            --notes "Debian 12/13 and Ubuntu: sudo apt install ./tokenstation_*.deb. Fedora: sudo dnf install ./tokenstation-*.rpm. Arch: sudo pacman -U tokenstation-*.pkg.tar.zst. Bazzite and SteamOS: unpack tokenstation-*-linux-amd64.tar.gz and run ./install.sh. See linux/README.md." \
            --latest=false

  latest:
    if: github.event_name == 'workflow_dispatch'
    needs: [package, deb, fedora, arch, portable, run-ubuntu]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tokenstation-*
          path: dist
          merge-multiple: true
      # A release's download counts go when it is replaced. The counts of the
      # build this run replaces are added to a list that each publishing run
      # hands to the next one (the artifact "download-counts"): one line a
      # file, with the time read, the build, when it was published, the file
      # and its count.
      - name: Keep the download counts of the build this one replaces
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p counts
          gh release view linux-latest --repo "$GITHUB_REPOSITORY" \
            --json name,publishedAt,targetCommitish,assets > old.json || exit 0
          sha=$(jq -r .targetCommitish old.json)
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow linux.yml --event workflow_dispatch \
                  --commit "$sha" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --dir counts -n download-counts || true
          fi
          jq -r --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '. as $r | .assets[] | [$now, $r.name, $r.publishedAt, .name, .downloadCount] | @tsv' \
            old.json | tee -a counts/downloads.tsv
          {
            echo "Download counts of the build this run replaces:"
            echo
            echo "| File | Downloads |"
            echo "|---|---|"
            jq -r '.assets[] | "| \(.name) | \(.downloadCount) |"' old.json
            echo
            echo "$(wc -l < counts/downloads.tsv) lines in download-counts so far."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: download-counts
          path: counts/downloads.tsv
          if-no-files-found: ignore
          retention-days: 90
      - name: Replace the linux-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cp tokenstation_*_amd64.deb tokenstation_latest_amd64.deb
          cp tokenstation-*.x86_64.rpm tokenstation-latest.x86_64.rpm
          cp tokenstation-*-linux-amd64.tar.gz tokenstation-latest-linux-amd64.tar.gz
          cp tokenstation-*.pkg.tar.* tokenstation-latest-x86_64.pkg.tar.zst 2>/dev/null || true
          ls -l
          gh release delete linux-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create linux-latest ./* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "TokenStation for Linux, newest build (${GITHUB_SHA::7})" \
            --notes "The newest build from ${GITHUB_REF_NAME}, for testing. Debian/Ubuntu: curl -LO .../tokenstation_latest_amd64.deb && sudo apt install ./tokenstation_latest_amd64.deb"
