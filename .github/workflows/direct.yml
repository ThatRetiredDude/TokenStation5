name: direct

# The direct engine (engine/direct): builds the assembler and checks every
# instruction form and every kernel against llvm-mc, byte for byte. llvm-mc
# is only the second opinion here; nothing it makes ships.

on:
  push:
    branches: [main, linux-package]
    paths: ["engine/direct/**", ".github/workflows/direct.yml"]
  pull_request:
    paths: ["engine/direct/**", ".github/workflows/direct.yml"]

jobs:
  assembler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install a compiler and llvm-mc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ cmake llvm-18
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - name: Build
        run: cmake -S engine/direct -B build/direct && cmake --build build/direct -j
      - name: Check against llvm-mc
        run: python3 engine/direct/tests/asm_check.py build/direct/ts5-asm
      - name: Assemble the built-in kernels
        run: build/direct/ts5-direct asm-only
      - name: Check generated read kernels against llvm-mc
        run: |
          for v in "4 0" "8 0 slc" "16 0 glc slc dlc" "4 1" "8 1 glc slc dlc" "16 1 slc" "3 0 glc dlc chunked" "4 1 slc dlc chunked"; do
            build/direct/ts5-direct gen $v > /tmp/gen.s
            python3 engine/direct/tests/asm_check.py build/direct/ts5-asm /tmp/gen.s
          done
      - name: Check the Q4_K mat-vec kernels against llvm-mc
        run: |
          for c in 2048 4096 12288 14336; do
            build/direct/ts5-direct gen-mv $c > /tmp/mv.s
            python3 engine/direct/tests/asm_check.py build/direct/ts5-asm /tmp/mv.s
          done
      - name: Check the second Q4_K mat-vec against llvm-mc
        run: |
          for v in "4096 0 1" "12288 0 2" "4096 8 3"; do
            build/direct/ts5-direct gen-mv2 $v > /tmp/mv2.s
            python3 engine/direct/tests/asm_check.py build/direct/ts5-asm /tmp/mv2.s
          done
      - name: Check the Q6_K mat-vec against llvm-mc
        run: |
          for v in "4096 0" "12288 0" "4096 8"; do
            build/direct/ts5-direct gen-mv6 $v > /tmp/mv6.s
            python3 engine/direct/tests/asm_check.py build/direct/ts5-asm /tmp/mv6.s
          done
      - name: Check the attention kernels against llvm-mc
        run: |
          for v in part reduce; do
            build/direct/ts5-direct gen-attn $v > /tmp/attn.s
            python3 engine/direct/tests/asm_check.py build/direct/ts5-asm /tmp/attn.s
          done
      - name: Check the token kernels against llvm-mc
        run: |
          build/direct/ts5-direct gen-ops > /tmp/ops.s
          python3 engine/direct/tests/asm_check.py build/direct/ts5-asm /tmp/ops.s
          for v in "4096 16" "12288 16" "4096 8" "4096 16 q6" "12288 8 q6" "4096 16 q4 10" "12288 16 q4 10" "4096 16 q6 10" "12288 16 q6 10" "4096 16 q4 12" "12288 16 q4 12" "4096 16 q4 12 2" "12288 16 q4 12 4" "4096 16 q4 12 8" "12288 16 q6 12 2" "4096 16 q6 12 4" "4096 16 q4 17 2" "12288 16 q4 17 1" "4096 64 q4 20 1" "12288 64 q4 20 2" "4096 32 q4 20 4" "4096 16 q4 21 1" "12288 16 q4 21 2" "4096 16 q4 21 4" "4096 16 q6 12" "12288 16 q6 12"; do
            build/direct/ts5-direct gen-mm $v > /tmp/mm.s
            python3 engine/direct/tests/asm_check.py build/direct/ts5-asm /tmp/mm.s
          done
          for v in "4096 16" "12288 16" "4096 8"; do
            build/direct/ts5-direct gen-xt $v > /tmp/xt.s
            python3 engine/direct/tests/asm_check.py build/direct/ts5-asm /tmp/xt.s
          done
          for v in 0 1 2 3; do
            build/direct/ts5-direct gen-mvs $v > /tmp/mvs.s
            python3 engine/direct/tests/asm_check.py build/direct/ts5-asm /tmp/mvs.s
          done
      - name: Keep ts5-direct for testing on the PS5
        uses: actions/upload-artifact@v4
        with:
          name: ts5-direct
          path: build/direct/ts5-direct
